[project]
name = "promptpriced"
version = "0.1.0"
description = "An honest, local LLM cost comparison stage"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115", "uvicorn>=0.34", "httpx>=0.28", "pydantic-settings>=2.7", "pyyaml>=6.0"]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.25"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/promptpriced"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
